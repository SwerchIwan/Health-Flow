name: healthflow

services:
  web:
    build: .
    image: healthflow-web:latest
    restart: unless-stopped
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["gunicorn", "HealthFlow.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--access-logfile", "-"]
    env_file: .env
    volumes:
      - ./HealthFlow/db.sqlite3:/app/HealthFlow/db.sqlite3
      - ./HealthFlow/media:/app/HealthFlow/media
      - static:/app/HealthFlow/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    expose:
      - "8000"

  bot:
    image: healthflow-web:latest
    restart: unless-stopped
    env_file: .env
    command: ["python", "tg.py"]
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/HealthFlow/staticfiles:ro
      - ./HealthFlow/media:/app/HealthFlow/media:ro
    depends_on:
      - web

volumes:
  static:
