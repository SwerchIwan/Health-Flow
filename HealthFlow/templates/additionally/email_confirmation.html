<!doctype html>
<html lang="en">
 {% load static %}
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

            .__logo-png{
                width: 100px;
            }

                    /* Указываем box sizing */
            *,
            *::before,
            *::after {
              box-sizing: border-box;
            }

            /* Убираем внутренние отступы */
            ul[class],
            ol[class] {
              padding: 0;
            }

            /* Убираем внешние отступы */
            body,
            h1,
            h2,
            h3,
            h4,
            p,
            ul[class],
            ol[class],
            li,
            figure,
            figcaption,
            blockquote,
            dl,
            dd {
              margin: 0;
            }

            /* Выставляем основные настройки по-умолчанию для body */
            body {
              min-height: 100vh;
              scroll-behavior: smooth;
              text-rendering: optimizeSpeed;
              line-height: 1.5;
            }

            /* Удаляем стандартную стилизацию для всех ul и il, у которых есть атрибут class*/
            ul[class],
            ol[class] {
              list-style: none;
            }

            /* Элементы a, у которых нет класса, сбрасываем до дефолтных стилей */
            a:not([class]) {
              text-decoration-skip-ink: auto;
            }

            /* Упрощаем работу с изображениями */
            img {
              max-width: 100%;
              display: block;
            }

            /* Указываем понятную периодичность в потоке данных у article*/
            article > * + * {
              margin-top: 1em;
            }

            /* Наследуем шрифты для инпутов и кнопок */
            input,
            button,
            textarea,
            select {
              font: inherit;
            }

            /* Удаляем все анимации и переходы для людей, которые предпочитай их не использовать */
            @media (prefers-reduced-motion: reduce) {
              * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
              }
            }
        .roboto-bold {
              font-family: "Roboto", sans-serif;
              font-weight: 700;
              font-style: normal;
            }

        .montserrat-alternates-medium {
              font-family: "Montserrat Alternates", sans-serif;
              font-weight: 500;
              font-style: normal;
            }


            .__logo{
                display: flex;
                align-items: center;
                margin-bottom: 20px;
            }

            .__logo-head-text{
                font-family: "Roboto", sans-serif;
                font-size: 40px;
                color: black;
            }

        .logo-min-text{
            font-family: "Montserrat Alternates", sans-serif;
            color: black;
            font-size: 17px;
            margin-top: -5px;
        }

        .huinya{
            font-family: "Roboto", sans-serif;
        }

        .none{
            color: black;
            text-decoration: none;
        }

        .top{
            margin-top: 20px;
        }


    </style>
</head>
<body>

    <a class="none" href="/">
        <span class="__logo">
            <div class="__logo-png ">
                <img src="https://i.postimg.cc/wTcSHbV8/logo-dark.png">
            </div>
            <div class="__logo-text">
                <div class="__logo-head-text">
                    <p>HEALTH FLOW AI</p>
                </div>
                <div class="logo-min-text">
                    The pulse of modern medicine
                </div>
            </div>
        </span>
    </a>
    <p style="color: black; font-size: 14px;">Здравствуйте! Вас приветствует команда <b class="huinya">HealthFlow!</b></p>
    <i style="color: black; font-size: 14px;">Для завершения регистрации перейдите по ссылке ниже:</i>
    <p class="top"><a style="font-size: 14px;" href="{{ confirmation_link }}">{{ confirmation_code }}</a></p>
</body>
</html>
