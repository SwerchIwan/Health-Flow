{% extends "base-auth.html" %}
{% load static %}

{% block title %}Подтверждение — Health Flow AI{% endblock %}
{% block information %}Код подтверждения{% endblock %}

{% block main %}
<p class="auth__lead" style="font-family:var(--font-text);font-size:15px;color:var(--ink-soft)">
    Код отправлен на {{ contact }}.
</p>
<form action="{% url 'confirm_registration' %}" method="post" class="auth__form">
    {% csrf_token %}
    <input type="hidden" name="choice" value="{{ choice }}">
    <input type="hidden" name="contact" value="{{ contact }}">
    <input class="input" type="text" id="confirmation_code" name="confirmation_code" placeholder="Код подтверждения" required>
    <button class="btn btn--dark btn--full" type="submit">Подтвердить</button>
</form>
{% endblock %}
