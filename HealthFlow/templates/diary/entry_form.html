<!-- diary/templates/diary/entry_form.html -->

<!DOCTYPE html>
<html>
<head>
    <title>Add New Entry</title>
</head>
<body>
    <h1>Add New Entry</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <a href="{% url 'entry_list' %}">Back to diary</a>
</body>
</html>
