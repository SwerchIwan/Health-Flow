<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f4f6f9;font-family:Montserrat,Segoe UI,Arial,sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 12px">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#fff;border-radius:16px;border:1px solid #e3e8ef">
                    <tr>
                        <td style="padding:28px 32px">
                            <div style="font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#22b6a5;font-weight:700">Health Flow AI</div>
                            <div style="font-size:11px;color:#8a97a8;margin-top:2px">The pulse of modern medicine</div>
                            <h1 style="font-size:22px;color:#12233b;margin:22px 0 10px">Здравствуйте!</h1>
                            <p style="font-size:14px;line-height:1.6;color:#465569;margin:0 0 22px">
                                Вы запросили подтверждение в Health Flow AI. Введите этот код на сайте:
                            </p>
                            <div style="font-size:22px;letter-spacing:2px;font-weight:700;color:#12233b;background:#eef7f6;border-radius:12px;padding:18px 20px;text-align:center">
                                Код: <span style="letter-spacing:8px;font-size:32px">{{ code }}</span>
                            </div>
                            <p style="font-size:13px;line-height:1.6;color:#8a97a8;margin:22px 0 0">
                                Код действует {{ ttl_minutes }} минут. Если вы не запрашивали подтверждение, просто проигнорируйте письмо.
                            </p>
                        </td>
                    </tr>
                </table>
                <p style="font-size:12px;color:#8a97a8;margin:16px 0 0">© Health Flow AI</p>
            </td>
        </tr>
    </table>
</body>
</html>
