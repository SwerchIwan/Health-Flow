<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f4f6f9;font-family:Montserrat,Segoe UI,Arial,sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 12px">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#fff;border-radius:16px;border:1px solid #e3e8ef">
                    <tr>
                        <td style="padding:28px 32px">
                            <div style="font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#22b6a5;font-weight:700">Health Flow AI</div>
                            <h1 style="font-size:22px;color:#12233b;margin:22px 0 10px">Новое сообщение</h1>
                            <p style="font-size:14px;line-height:1.6;color:#465569;margin:0 0 18px">Вам написали в чате:</p>
                            <div style="font-size:14px;line-height:1.6;color:#12233b;background:#f4f6f9;border-left:3px solid #22b6a5;border-radius:8px;padding:14px 16px">
                                {{ preview }}
                            </div>
                            <p style="margin:24px 0 0">
                                <a href="{{ chat_url }}" style="display:inline-block;background:#12233b;color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 22px;border-radius:999px">Открыть чат</a>
                            </p>
                        </td>
                    </tr>
                </table>
                <p style="font-size:12px;color:#8a97a8;margin:16px 0 0">© Health Flow AI</p>
            </td>
        </tr>
    </table>
</body>
</html>
