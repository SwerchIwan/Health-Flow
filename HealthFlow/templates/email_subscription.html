<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f4f6f9;font-family:Montserrat,Segoe UI,Arial,sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 12px">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#fff;border-radius:16px;border:1px solid #e3e8ef">
                    <tr>
                        <td style="padding:28px 32px">
                            <div style="font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#22b6a5;font-weight:700">Health Flow AI</div>
                            <h1 style="font-size:22px;color:#12233b;margin:22px 0 10px">Подписка {{ plan.name }} активирована</h1>
                            <p style="font-size:14px;line-height:1.6;color:#465569;margin:0 0 18px">
                                Спасибо за оплату! Тариф действует до {{ until|date:"d.m.Y" }}.
                            </p>
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;color:#12233b;border-top:1px solid #e3e8ef">
                                <tr><td style="padding:10px 0;color:#8a97a8">Тариф</td><td align="right" style="padding:10px 0">{{ plan.name }}</td></tr>
                                <tr><td style="padding:10px 0;color:#8a97a8">Сумма</td><td align="right" style="padding:10px 0">{{ amount|floatformat:"-2" }} Br</td></tr>
                                <tr><td style="padding:10px 0;color:#8a97a8">Карта</td><td align="right" style="padding:10px 0">{{ card_mask }}</td></tr>
                            </table>
                            <p style="font-size:13px;line-height:1.6;color:#8a97a8;margin:22px 0 0">
                                Если вы не оформляли подписку, напишите в поддержку через бота Health Flow.
                            </p>
                        </td>
                    </tr>
                </table>
                <p style="font-size:12px;color:#8a97a8;margin:16px 0 0">© Health Flow AI</p>
            </td>
        </tr>
    </table>
</body>
</html>
