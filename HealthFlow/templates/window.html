<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Окно техподдержки</title>
<link rel="stylesheet" href="{% static 'css/window.css' %}">
</head>
<body>
<script src="{% static 'js/window.js' %}"></script>
<div class="corner-popup" id="cornerPopup">
    <div class="title-bar">
        <span class="title">Техподдержка</span>
        <div class="controls">
            <button class="maximize-btn" id="maximizeBtn">□</button>
            <button class="close-btn" id="closeBtn">&times;</button>
        </div>
    </div>
    <div class="chat-content">
        <div class="message-area" id="messageArea"></div>
        <div class="text-field">
            <div class="text-field__icon">
                <form id="supportForm">
                    <input class="text-field__input" id="messageInput" placeholder="Введите ваше сообщение">
                    <button class="text-field__aicon" type="submit" id="submitButton">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" /></svg>
                    </button>
                </form>
            </div>
          </div>
    </div>
</div>

<div class="black-circle" id="blackCircle"></div>

<script src="script.js"></script>

</body>
</html>
