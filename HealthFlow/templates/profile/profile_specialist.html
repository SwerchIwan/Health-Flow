<!doctype html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="shortcut icon" type="image/png" href="{% static 'css/img/icon.ico' %}" sizes="32x32"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <link rel="stylesheet" href="{% static 'css/standart.css' %}">
    <link rel="stylesheet" href="{% static 'css/form_specialist.css' %}">
    <script src="{% static 'js/script.js' %}"></script>

    <title>Стать специалистом</title>
</head>
<body>

    <canvas></canvas>
    <div class="block-form-specialist is-center">
        <div class="__block-form-specialist row">
            <div class="__block-form-specialist">
                <div class="form-specialist">
                    <div class="__form-specialist-header">
                        <div class="elem-with-logo">
                            <a href="/">
                                <span class="__logo">
                                    <div class="__logo-png">
                                        <img src="{% static 'css/img/logo.png' %}" alt="">
                                    </div>
                                    <div class="__logo-text">
                                        <div class="__logo-head-text">
                                            <p>HEALTH FLOW AI</p>
                                        </div>
                                        <div class="logo-min-text">
                                            The pulse of modern medicine
                                        </div>
                                    </div>
                                </span>
                            </a>
                        </div>
                        <div class="__block-title-form-specialist">
                            <div class="title-specialist-form">
                                <h4>Заполните форму для отправки объявления</h4>
                            </div>
                            <div class="info-title-specialist-form">
                                <p>Отправьте нам вашу заявку, в течении 7-14 дней она будет проверена и вам напишут пригласительное письмо для встречи с нашей командой.</p>
                            </div>
                        </div>
                    </div>
                    <div class="__form-specialist">
                        <form id="userform" method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="name-lastname-specialist">
                                <div class="input-name">
                                    <label for="first_name" class="mix-blend">Введите имя:</label>
                                    <input type="text" name="first_name" placeholder="Ваше имя" id="first_name" required>
                                </div>
                                <div class="input-lastname">
                                    <label for="last_name" class="mix-blend">Введите фамилию:</label>
                                    <input type="text" name="last_name" placeholder="Ваша фамилия" id="last_name" required>
                                </div>
                            </div>
                            <div class="name-lastname-specialist">
                                <div class="input-name">
                                    <label for="contact" class="mix-blend">Ваши дополнительные контакты:</label>
                                    <input style="width: 500px;" type="text" name="contact" placeholder="Введите дополнительный контакт" id="contact" required>
                                </div>
                            </div>
                            <div class="name-lastname-specialist">
                                <div class="input-name">
                                    <label for="additional_info" class="mix-blend">Ваша дополнительная информация:</label>
                                    <textarea id="additional_info" name="additional_info" cols="80" rows="8" placeholder="Опишите себя здесь..." required></textarea>
                                </div>
                            </div>
                            <div class="name-lastname-specialist">
                                <div class="input-name">
                                    <button class="button outline" type="submit" value="Отправить">Отправить</button>
                                </div>
                                <div class="input-name">
                                    <input type="file" id="attached_file" name="attached_file" accept="image/*">
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
