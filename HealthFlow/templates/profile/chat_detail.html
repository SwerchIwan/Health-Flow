<!-- chat_detail.html -->
<div class="__elem-chat-block">
    <div class="__elem-chat-block-info">
        <div class="block-avatar-message">
            {% if chat.specialist.user.photo %}
                <img src="{{ chat.specialist.user.photo.url }}" alt="{{ chat.specialist.name }}">
            {% else %}
                <img src="/static/css/img/default-avatar.svg" alt="">
            {% endif %}
        </div>
        <div class="__block-message">
            <div class="block-nickname">{{ chat.specialist.name }}</div>
            <div class="block-last-message">{{ chat.last_message }}</div>
        </div>
    </div>
    <div class="message-block">
        {% for message in messages %}
            <div class="message {{ message.sender == user ? 'sent' : 'received' }}">
                <div class="message-content">{{ message.content }}</div>
                <div class="message-timestamp">{{ message.timestamp }}</div>
            </div>
        {% endfor %}
    </div>
    <form id="message-form">
        <input type="hidden" name="chat_id" value="{{ chat.id }}">
        <textarea name="message" placeholder="Напишите сообщение..." required></textarea>
        <button type="submit">Отправить</button>
    </form>
</div>

<script>
    document.getElementById('message-form').addEventListener('submit', function(event) {
        event.preventDefault();
        let formData = new FormData(this);
        fetch('/send_message/', {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            }
        }).then(response => response.json()).then(data => {
            if (data.status === 'success') {
                let newMessage = document.createElement('div');
                newMessage.className = 'message sent';
                newMessage.innerHTML = `<div class="message-content">${data.message}</div><div class="message-timestamp">${data.timestamp}</div>`;
                document.querySelector('.message-block').appendChild(newMessage);
                document.querySelector('textarea[name="message"]').value = '';
            }
        });
    });
</script>
